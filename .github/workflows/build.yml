name: Build AutoTest APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

  # FR-OPS-05: dependency review on pull requests is a separate job below

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Fetch hev-socks5-tunnel AAR (tun2socks engine for the VPN feature; non-blocking)
        continue-on-error: true
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 3 -o app/libs/hev-socks5-tunnel.aar https://github.com/heiher/hev-socks5-tunnel/releases/latest/download/hev-socks5-tunnel.aar \
            || rm -f app/libs/hev-socks5-tunnel.aar
          ls -la app/libs || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Probe newer androidx.webkit 1.15.0 (non-blocking, tells whether the upgrade compiles)
        continue-on-error: true
        run: gradle assembleDebug -PwebkitVersion=1.15.0 --no-daemon -x lint 2>&1 | tail -40

      - name: Rebuild default APK (the probe may have changed outputs)
        run: gradle assembleDebug --no-daemon

      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Android lint / static analysis (non-blocking)
        continue-on-error: true
        run: gradle lintDebug --no-daemon

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoTestApp-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "AutoTestApp Build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
